<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频下载工具</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141922; --panel2:#1b2130; --line:#262e3f;
    --fg:#e8ecf4; --dim:#8a93a8; --dim2:#5f6880;
    --accent:#4d8dff; --accent2:#7aa9ff; --ok:#2fbf71;
    --warn:#e8a33d; --err:#e8564a; --info:#4fb3d9;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
       -webkit-font-smoothing:antialiased}

  /* ── 顶栏 ───────────────────────────────────────────── */
  header{position:sticky;top:0;z-index:10;
         background:rgba(11,14,20,.88);backdrop-filter:blur(10px);
         border-bottom:1px solid var(--line);
         padding:13px 22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .mark{width:34px;height:34px;border-radius:10px;flex:none;
        background:linear-gradient(145deg,var(--accent),#6b5cff);
        display:grid;place-items:center;box-shadow:0 4px 14px rgba(77,141,255,.28)}
  .mark svg{width:17px;height:17px;display:block}
  .brand h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px;
            line-height:1.25;white-space:nowrap}
  .brand p{margin:0;font-size:11.5px;color:var(--dim2);line-height:1.3;
           white-space:nowrap}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto;align-items:center}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;
        padding:4px 11px;font-size:12px;color:var(--dim);white-space:nowrap}
  .chip b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
  .chip.btn{cursor:pointer;transition:border-color .15s,color .15s}
  .chip.btn:hover{border-color:var(--accent);color:var(--fg)}

  /* ── 主体 ───────────────────────────────────────────── */
  main{display:grid;grid-template-columns:minmax(330px,395px) 1fr;
       gap:18px;padding:18px 22px 28px;align-items:start;
       max-width:1500px;margin:0 auto}
  @media(max-width:940px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);
        border-radius:var(--radius);padding:17px}
  .card > h2{font-size:11.5px;margin:0 0 13px;color:var(--dim2);font-weight:600;
             text-transform:uppercase;letter-spacing:1px}

  /* ── 表单 ───────────────────────────────────────────── */
  textarea,input{width:100%;background:var(--panel2);border:1px solid var(--line);
                 border-radius:10px;color:var(--fg);padding:11px 12px;font:inherit;
                 font-family:inherit;resize:vertical;transition:border-color .15s}
  textarea{min-height:132px;line-height:1.6}
  textarea::placeholder,input::placeholder{color:var(--dim2)}
  textarea:focus,input:focus{outline:none;border-color:var(--accent);
                             box-shadow:0 0 0 3px rgba(77,141,255,.12)}
  .row{display:flex;gap:9px;margin-top:9px}
  .row input{flex:1;min-width:0}
  button{background:var(--accent);color:#fff;border:0;border-radius:10px;
         padding:10px 18px;font:inherit;font-weight:500;cursor:pointer;
         transition:filter .15s,transform .08s;white-space:nowrap}
  button:hover{filter:brightness(1.12)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--fg)}
  button.ghost:hover{border-color:var(--dim2)}
  button.tiny{padding:6px 11px;font-size:12px;border-radius:8px}
  button.wide{flex:1;justify-content:center}
  .hint{color:var(--dim2);font-size:12px;margin-top:13px;line-height:1.75}
  .hint b{color:var(--dim);font-weight:600}
  .hint code{background:var(--panel2);padding:1.5px 6px;border-radius:5px;
             font-size:11px;color:var(--info);font-family:ui-monospace,Consolas,monospace}
  .kbd{display:inline-block}

  /* ── 任务列表 ───────────────────────────────────────── */
  .orders{display:flex;flex-direction:column;gap:12px}
  .order{background:var(--panel);border:1px solid var(--line);
         border-radius:var(--radius);padding:15px;transition:border-color .2s}
  .order.done{border-color:#1d5f3f}
  .order.failed,.order.need_manual{border-color:#63301f}
  .order.active{border-color:#2a4a80}
  .order-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .st{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;
      background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
  .st.done{background:#102e1d;border-color:#1d5f3f;color:var(--ok)}
  .st.failed{background:#33170f;border-color:#63301f;color:var(--err)}
  .st.need_manual{background:#33270f;border-color:#655021;color:var(--warn)}
  .st.downloading,.st.resolving,.st.resolved,.st.packaging{
      background:#101f2e;border-color:#2a4a80;color:var(--info)}
  .oid{color:var(--dim2);font-size:12px;font-variant-numeric:tabular-nums}
  .who{color:var(--dim2);font-size:12px;margin-left:auto;text-align:right;
       max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .msg{background:var(--panel2);border-radius:10px;padding:10px 12px;margin:11px 0 0;
       font-size:13px;color:#bcc5d8;white-space:pre-wrap;word-break:break-all;
       max-height:98px;overflow:auto}
  .bar{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;
       margin:11px 0 0}
  .bar i{display:block;height:100%;background:var(--accent);
         transition:width .35s ease}
  .bar.done i{background:var(--ok)}
  .bar.failed i{background:var(--err)}
  .meta{font-size:12px;color:var(--dim);word-break:break-all;margin-top:7px}
  .meta b{color:var(--fg);font-weight:600}
  .meta a{color:var(--info);text-decoration:none}
  .meta a:hover{text-decoration:underline}
  .reply{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
  .reply-txt{background:#0d1a13;border:1px solid #1d4030;border-radius:10px;
             padding:11px;font-size:13px;white-space:pre-wrap;
             word-break:break-word;color:#cfe3d6}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  details{margin-top:11px}
  summary{cursor:pointer;color:var(--dim2);font-size:12px;user-select:none}
  summary:hover{color:var(--dim)}
  pre{background:var(--panel2);border-radius:10px;padding:11px;font-size:11.5px;
      overflow:auto;max-height:240px;color:#95a0b8;white-space:pre-wrap;
      word-break:break-all;line-height:1.6;
      font-family:ui-monospace,Consolas,"Courier New",monospace}

  /* ── 空态 ───────────────────────────────────────────── */
  .empty{text-align:center;padding:52px 20px;color:var(--dim2)}
  .empty svg{width:44px;height:44px;opacity:.35;display:block;margin:0 auto 14px}
  .empty p{margin:0;font-size:13px}
  .empty small{display:block;margin-top:6px;font-size:11.5px;color:var(--dim2);
               opacity:.75}

  /* ── Toast ──────────────────────────────────────────── */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%)
         translateY(8px);background:var(--ok);color:#fff;padding:11px 22px;
         border-radius:10px;font-size:13px;opacity:0;pointer-events:none;
         transition:opacity .22s,transform .22s;z-index:99;
         box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:80vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--err)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3v11m0 0l-4-4m4 4l4-4" stroke="#fff" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke="#fff"
              stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <h1>视频下载工具</h1>
      <p>粘贴链接，自动解析并下载</p>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <section class="card">
    <h2>新建下载</h2>
    <textarea id="text" placeholder="把视频链接粘到这里，例如：&#10;&#10;7.92 复制打开抖音，看看【@小明 的作品】这个视频太搞笑了 https://v.douyin.com/iRNBho6/"></textarea>
    <div class="row">
      <input id="conversation" placeholder="备注（可选）">
      <input id="sender" placeholder="标签（可选）" style="max-width:132px">
    </div>
    <div class="row">
      <button id="submit" class="wide" onclick="submitOrder()">开始下载</button>
      <button class="ghost" onclick="document.getElementById('text').value=''">清空</button>
    </div>
    <div class="hint">
      链接、分享文案、甚至只有一句标题都能识别。
      <br>没带链接时会用标题去 <b>Google / DuckDuckGo</b> 自动找源。
      <br>受版权保护的平台（腾讯视频、爱奇艺等）会自动识别并提示。
      <br><span class="kbd"><code>Ctrl</code> + <code>Enter</code></span> 快速开始
    </div>
  </section>

  <section class="card">
    <h2>下载任务</h2>
    <div class="orders" id="orders">
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.6"/>
          <path d="M10 9.5l5 2.5-5 2.5v-5z" fill="currentColor"/>
        </svg>
        <p>还没有下载任务</p>
        <small>把视频链接粘到左边，点「开始下载」</small>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
let busy = false;

function apiUrl(path){
  if(!TOKEN) return path;
  return path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);
}
function toast(msg, isErr){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast', 2200);
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtSize(n){
  if(!n) return '—';
  const u = ['B','KB','MB','GB']; let i = 0, v = n;
  while(v >= 1024 && i < u.length-1){ v /= 1024; i++; }
  return v.toFixed(i ? 1 : 0) + ' ' + u[i];
}

async function submitOrder(){
  const text = document.getElementById('text').value.trim();
  if(!text){ toast('先粘贴视频链接', true); return; }
  const btn = document.getElementById('submit');
  btn.disabled = true; btn.textContent = '提交中…';
  try{
    const r = await fetch(apiUrl('/api/orders'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        text,
        conversation_id: document.getElementById('conversation').value.trim(),
        sender: document.getElementById('sender').value.trim(),
      })
    });
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || '提交失败');
    toast(d.created ? '已加入下载队列 #' + d.order.id : '这条已经提交过了');
    if(d.created){ document.getElementById('text').value = ''; }
    await refresh();
  }catch(e){ toast(e.message, true); }
  finally{ btn.disabled = false; btn.textContent = '开始下载'; }
}

async function act(id, what, label){
  try{
    const r = await fetch(apiUrl('/api/orders/' + id + '/' + what), {method:'POST'});
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || '操作失败');
    toast(label || '已执行');
    await refresh();
  }catch(e){ toast(e.message, true); }
}

async function copyReply(id){
  try{
    const r = await fetch(apiUrl('/api/orders/' + id));
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || '读取失败');
    await navigator.clipboard.writeText(d.reply || '');
    await fetch(apiUrl('/api/orders/' + id + '/replied'), {method:'POST'});
    toast('文案已复制到剪贴板');
    await refresh();
  }catch(e){
    toast('复制失败，请手动选中：' + e.message, true);
  }
}

function downloadFile(id){
  window.location.href = apiUrl('/api/orders/' + id + '/file');
}

async function revealFile(id){
  try{
    const r = await fetch(apiUrl('/api/orders/' + id + '/reveal'), {method:'POST'});
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || '打开失败');
    toast(d.opened ? '已在文件管理器里定位' : '路径：' + d.path);
  }catch(e){ toast(e.message, true); }
}

async function revealDir(){
  try{
    const r = await fetch(apiUrl('/api/reveal-dir'), {method:'POST'});
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || '打开失败');
    toast(d.opened ? '已打开下载目录' : '路径：' + d.path);
  }catch(e){ toast(e.message, true); }
}

async function refresh(){
  if(busy) return;
  busy = true;
  try{
    const r = await fetch(apiUrl('/api/state'));
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || '');
    renderChips(d);
    renderOrders(d.orders || []);
  }catch(e){
    document.getElementById('chips').innerHTML =
      '<span class="chip" style="color:var(--err)">连接失败：' + esc(e.message) + '</span>';
  }finally{ busy = false; }
}

function renderChips(d){
  const s = d.stats || {};
  const chips = [
    ['进行中', s.active || 0],
    ['已完成', s.done || 0],
    ['失败', s.failed || 0],
    ['排队', d.pending || 0],
  ];
  document.getElementById('chips').innerHTML = chips.map(
    ([k,v]) => `<span class="chip">${k} <b>${v}</b></span>`
  ).join('')
    + `<span class="chip btn" onclick="revealDir()" title="${esc(d.download_dir||'')}">📁 下载目录</span>`
    + `<span class="chip btn" onclick="loginPlatform('douyin')" title="登录态兜底：抖音（TikHub 额度不够时用）">🔑 登录抖音</span>`
    + `<span class="chip btn" onclick="loginPlatform('tiktok')" title="登录态兜底：TikTok">🔑 登录TikTok</span>`
    + `<span class="chip" title="${esc((d.engines||[]).join(' / '))}">引擎 <b>${esc((d.engines||[])[0]||'-')}</b></span>`;
}

async function loginPlatform(platform){
  try{
    const r = await fetch(apiUrl('/api/cdp-login'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({platform})
    });
    const d = await r.json();
    toast(d.message || (d.ok ? '已打开浏览器，请登录' : '登录失败'));
  }catch(e){
    toast('登录失败：' + e.message);
  }
}

function renderOrders(orders){
  const box = document.getElementById('orders');
  if(!orders.length){
    box.innerHTML = `<div class="empty">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.6"/>
          <path d="M10 9.5l5 2.5-5 2.5v-5z" fill="currentColor"/>
        </svg>
        <p>还没有下载任务</p>
        <small>把视频链接粘到左边，点「开始下载」</small>
      </div>`;
    return;
  }
  box.innerHTML = orders.map(o => {
    const pct = Math.max(0, Math.min(100, o.progress || 0));
    const cls = (o.status === 'done' || o.status === 'failed' || o.status === 'need_manual')
      ? o.status : 'active';
    const rawMsg = (o.text || '').trim();
    const msg = rawMsg.length > 160 ? rawMsg.slice(0, 160) + '…' : rawMsg;
    const title = o.title ? `<div class="meta">标题：<b>${esc(o.title)}</b></div>` : '';
    const src = o.chosen_url
      ? `<div class="meta">来源：<a href="${esc(o.chosen_url)}" target="_blank" rel="noopener">${esc(o.chosen_url.slice(0,110))}</a></div>`
      : '';
    const file = o.file_path
      ? `<div class="meta">文件：<b>${esc(o.file_path.split(/[\\/]/).pop())}</b> · ${fmtSize(o.file_size)}</div>` : '';
    const err = o.error ? `<div class="meta" style="color:var(--warn)">${esc(o.error)}</div>` : '';

    return `<div class="order ${cls}">
      <div class="order-head">
        <span class="st ${o.status}">${esc(o.status_label)}</span>
        <span class="oid">#${o.id}</span>
        <span class="who">${esc(o.sender || o.conversation_id || '')}${o.stage ? ' · ' + esc(o.stage) : ''}</span>
      </div>
      <div class="msg">${esc(msg)}</div>
      <div class="bar ${cls}"><i style="width:${pct}%"></i></div>
      ${title}${src}${file}${err}
      ${o.reply ? `<div class="reply"><div class="reply-txt">${esc(o.reply)}</div></div>` : ''}
      <div class="acts">
        ${o.file_path ? `<button class="tiny" onclick="downloadFile(${o.id})">⬇ 下载文件</button>` : ''}
        ${o.file_path ? `<button class="tiny ghost" onclick="revealFile(${o.id})" title="${esc(o.file_path)}">📂 打开文件夹</button>` : ''}
        ${o.reply ? `<button class="tiny ghost" onclick="copyReply(${o.id})">📋 复制文案</button>` : ''}
        ${(o.status === 'failed' || o.status === 'need_manual')
          ? `<button class="tiny ghost" onclick="act(${o.id},'retry','已重新开始')">↻ 重试</button>` : ''}
        ${cls === 'active'
          ? `<button class="tiny ghost" onclick="act(${o.id},'cancel','已取消')">✕ 取消</button>` : ''}
        <button class="tiny ghost" onclick="toggleDetail(${o.id})">📜 日志</button>
      </div>
      <pre id="log-${o.id}" style="display:none"></pre>
    </div>`;
  }).join('');
}

async function toggleDetail(id){
  const el = document.getElementById('log-' + id);
  if(el.style.display !== 'none'){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.textContent = '加载中…';
  try{
    const r = await fetch(apiUrl('/api/orders/' + id));
    const d = await r.json();
    const lines = (d.events || []).map(e => {
      const t = new Date(e.ts * 1000).toLocaleTimeString('zh-CN', {hour12:false});
      return `[${t}] ${e.level.toUpperCase().padEnd(5)} ${e.message}`;
    });
    const head = `任务 #${d.id}  状态=${d.status}  阶段=${d.stage}\n`
      + `识别到 ${(d.links||[]).length} 条链接\n` + '-'.repeat(60) + '\n';
    el.textContent = head + (lines.join('\n') || '（暂无日志）');
  }catch(e){ el.textContent = '读取日志失败：' + e.message; }
}

document.getElementById('text').addEventListener('keydown', ev => {
  if(ev.ctrlKey && ev.key === 'Enter') submitOrder();
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
